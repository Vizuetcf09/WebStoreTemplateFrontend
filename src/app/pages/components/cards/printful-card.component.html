<section
  class="group cursor-pointer bg-white rounded-[1.25rem] p-4 sm:p-5 shadow-[0_10px_30px_rgba(32,36,44,0.06)] hover:shadow-[0_18px_45px_rgba(32,36,44,0.13)] hover:-translate-y-1 transition-all duration-300 ease-out w-full max-w-sm mx-auto flex flex-col h-full justify-between ring-1 ring-black/4">

  <!-- Product Image -->
  <div class="flex justify-center mb-6 h-48 shrink-0 overflow-hidden rounded-xl bg-brand-gray/50">
    <img [src]="product().thumbnailUrl" [alt]="product().name"
      class="h-full object-contain group-hover:scale-105 transition-transform duration-300 ease-out">
  </div>
  <!-- Product Info -->
  <header class="text-center mb-4 grow flex flex-col justify-center">
    <h2
      class="text-lg sm:text-xl font-bold text-brand-ink group-hover:text-brand-purple transition-colors duration-300 mb-1">
      {{ product().name }}</h2>
  </header>
  <!-- Bottom Row: Variants count -->

  <div class="flex items-end justify-between mt-auto pt-2">
    <p class="text-sm text-gray-500 text-left leading-tight">
      {{ product().variantsCount }} variante(s)
    </p>
    <span
      class="bg-brand-lilac text-brand-purple group-hover:bg-brand-purple group-hover:text-white font-bold py-2 px-3 rounded-xl text-sm transition-colors duration-300 whitespace-nowrap">
      {{ product().syncedCount }} sincronizadas
    </span>
  </div>
</section>
