@for (product of products; track product.id){
<div class="flex-grow flex flex-col lg:flex-row items-center gap-12 lg:gap-20 px-6 md:px-12 lg:px-20 pb-16 pt-6 animate-fade-in">
  <!-- Products image -->
  <div class="w-full lg:w-1/2 flex justify-center">
    <div class="group bg-white rounded-3xl shadow-md hover:shadow-2xl transition-all duration-500 ease-out flex items-center justify-center w-full max-w-2xl p-8 overflow-hidden">
      <img [src]="product.imageUrl" [alt]="product.name"
        class="max-h-[520px] w-full object-contain drop-shadow-xl transition-transform duration-500 ease-out group-hover:scale-105">
    </div>
  </div>

  <!-- Products details -->
  <div class="w-full lg:w-1/2 space-y-6">
    <div class="space-y-3">
      <h1 class="text-4xl md:text-6xl font-black text-brand-dark tracking-tight">
        {{ product.name }}
      </h1>
      <p class="text-lg text-gray-600 leading-relaxed max-w-2xl">
        {{ product.description }}
      </p>
    </div>

    <p class="text-3xl md:text-4xl font-black text-brand-dark">
      {{ product.price | currency }}
    </p>

    <div class="flex items-center gap-4">
      <span class="inline-block px-4 py-1.5 rounded-full bg-purple-50 text-purple-900 text-sm font-semibold border border-purple-100">
        {{ product.category }}
      </span>
    </div>

    <button (click)="onPurchase(product)" [disabled]="isPaying()" [class.opacity-50]="isPaying()"
      [class.cursor-not-allowed]="isPaying()"
      class="bg-brand-green text-brand-dark hover:bg-purple-600 hover:text-white font-bold text-lg px-10 py-4 rounded-full shadow-md hover:shadow-xl hover:shadow-purple-500/25 hover:scale-105 active:scale-95 transition-all duration-300 ease-out w-full sm:w-auto flex items-center justify-center gap-3">

      @if (isPaying()) {
      <span>Processing...</span>
      } @else {
      <span>Purchase</span>
      }

    </button>
  </div>

</div>
} @empty {
<div class="flex justify-center items-center h-64">
  <p class="text-gray-500 text-xl animate-pulse">Buscando productos en la tienda...</p>
</div>
}
