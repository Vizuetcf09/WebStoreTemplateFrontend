@for (product of products; track product.id){
<div
  class="site-container grow flex flex-col lg:flex-row items-center gap-12 lg:gap-20 px-6 md:px-12 lg:px-20 pb-16 pt-6 animate-fade-in">
  <!-- Products image -->
  <div class="w-full lg:w-1/2 flex justify-center">
    <div
      class="group bg-white rounded-3xl shadow-md hover:shadow-2xl transition-all duration-500 ease-out flex items-center justify-center w-full max-w-2xl p-8 overflow-hidden">
      <img [src]="product.imageUrl" [alt]="product.name"
        class="max-h-130 w-full object-contain drop-shadow-xl transition-transform duration-500 ease-out group-hover:scale-105">
    </div>
  </div>

  <!-- Products details -->
  <div class="w-full lg:w-1/2 space-y-6">
    <div class="space-y-3">
      <h1 class="text-4xl md:text-6xl font-black text-brand-dark tracking-tight">
        {{ product.name }}
      </h1>
      <p class="text-lg text-gray-600 leading-relaxed max-w-2xl">
        {{ product.description }}
      </p>
    </div>

    <p class="text-3xl md:text-4xl font-black text-brand-dark">
      {{ product.price | currency }}
    </p>

    <div class="flex items-center gap-4">
      <span
        class="inline-block px-4 py-1.5 rounded-full bg-purple-50 text-purple-900 text-sm font-semibold border border-purple-100">
        {{ product.category }}
      </span>
    </div>

    <div class="flex flex-col gap-3 sm:flex-row">
      <button (click)="onPurchase(product)" [disabled]="isPaying() || mercadoPagoService.loadingPayingSignal()"
        class="bg-brand-purple text-white font-bold text-lg px-8 py-4 rounded-full shadow-md transition-all duration-300 w-full sm:w-auto disabled:cursor-not-allowed disabled:opacity-50">
        {{ isPaying() ? 'Procesando...' : 'Pagar con PayPal' }}
      </button>
      @if (false) {
      <button (click)="onMercadoPagoPurchase(product)"
        [disabled]="isPaying() || mercadoPagoService.loadingPayingSignal()"
        class="bg-brand-green text-brand-dark font-bold text-lg px-8 py-4 rounded-full shadow-md transition-all duration-300 w-full sm:w-auto disabled:cursor-not-allowed disabled:opacity-50">
        {{ mercadoPagoService.loadingPayingSignal() ? 'Procesando...' : 'Pagar con Mercado Pago' }}
      </button>
      }
    </div>
  </div>

</div>
} @empty {
<div class="flex justify-center items-center h-64">
  <p class="text-gray-500 text-xl animate-pulse">Buscando productos en la tienda...</p>
</div>
}
