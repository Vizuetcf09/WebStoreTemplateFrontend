<section class=" bg-brand-white w-full px-4 py-2 overflow-hidden relative">
  @if (products.length > 0) {

  <div class="grid bg-brand-gray items-center justify-center rounded-3xl">

    <div class="sm:p-12 max-w-3xl">
      <h1 class="text-center text-6xl font-black font-sans text-brand-dark">¡Tus prendas favoritas a un clic de tu
        espejo!</h1>
    </div>

    @for (product of products; track product.id) {
    <div class="lg:grid-cols-3 md:grid-cols-2 sm:grid-cols-1 sm:p-6 rounded-3xl items-center justify-center gap-12 ">
      <Card [product]="product"></Card>
    </div>
    }
  </div> }

  @else {
  <p class="text-gray-500">Cargando Productos...</p>
  }
</section>
