<header class="h-fit justify-center py-2 relative z-50">
  <!-- Unified Container -->
  <div
    class="site-container h-fit bg-brand-green/95 backdrop-blur-md shadow-[0_12px_35px_rgba(32,36,44,0.12)] ring-1 ring-black/5 transition-all duration-500 ease-in-out overflow-hidden relative"
    [ngClass]="isMenuOpen ? 'py-6 px-5 sm:px-8 rounded-[1.75rem]' : 'px-4 sm:px-6 py-3 rounded-[1.25rem]'">

    <!-- Top Row: Logo & Controls -->
    <div class="flex justify-between items-center w-full">
      <!-- Logo -->
      <div class="text-2xl sm:text-3xl font-black text-brand-dark tracking-[-0.04em]">
        <a routerLink="/" aria-label="Web Store home"> Web/Store<span class="text-brand-purple">.</span> </a>
      </div>

      <!-- Desktop Menu (Hidden on Mobile) -->
      <nav class="hidden md:flex items-center gap-8 font-bold text-brand-dark text-lg"
        [ngClass]="{'opacity-0 pointer-events-none': isMenuOpen}">

        @for (item of menuItems; track item.link) {
        <a [routerLink]="item.link" class="hover:opacity-70 transition-opacity">
          {{ item.label }}
        </a>
        }
        @if (auth.isAdmin()) {
        <a routerLink="/admin" class="hover:opacity-70 transition-opacity">Admin</a>
        }
        @if (auth.isAuthenticated()) {
        <button type="button" (click)="logout()"
          class="rounded-xl bg-brand-dark text-white px-4 py-2 hover:opacity-80 transition-opacity">Logout</button>
        } @else {
        <a routerLink="/auth"
          class="rounded-xl bg-brand-dark text-white px-4 py-2 hover:opacity-80 transition-opacity">Login</a>
        }

      </nav>

      <!-- Mobile Toggle Buttons -->
      <div class="md:hidden">
        <button type="button" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen" aria-label="Abrir menú"
          class="flex flex-col gap-1.5 focus:outline-none z-50 p-2 -mr-2 rounded-xl hover:bg-white/30">
          <span class="block w-8 h-1 bg-brand-dark rounded-full transition-all duration-300"
            [ngClass]="{'rotate-45 translate-y-2.5': isMenuOpen}">
          </span>
          <span class="block w-8 h-1 bg-brand-dark rounded-full transition-all duration-300"
            [ngClass]="{'opacity-0': isMenuOpen}">
          </span>
          <span class="block w-8 h-1 bg-brand-dark rounded-full transition-all duration-300"
            [ngClass]="{'-rotate-45 -translate-y-2.5': isMenuOpen}">
          </span>
        </button>
      </div>
    </div>

    <!-- Mobile Menu Links -->
    <nav
      class="flex flex-col gap-6 font-bold text-brand-dark text-2xl text-start transition-all duration-300 overflow-hidden px-4"
      [ngClass]="{
        'max-h-0 opacity-0 pointer-events-none': !isMenuOpen,
        'max-h-96 opacity-100 mt-6': isMenuOpen
      }">

      @for (item of menuItems; track item.link) {
      <a [routerLink]="item.link" (click)="toggleMenu()" class="hover:opacity-70 transition-opacity">
        {{ item.label }}
      </a>
      }
      @if (auth.isAdmin()) {
      <a routerLink="/admin" (click)="toggleMenu()" class="hover:opacity-70 transition-opacity">Admin</a>
      }
      @if (auth.isAuthenticated()) {
      <button type="button" (click)="logout()"
        class="rounded-xl bg-brand-dark text-white px-4 py-3 hover:opacity-80 transition-opacity text-left">Logout</button>
      } @else {
      <a routerLink="/auth" (click)="toggleMenu()"
        class="rounded-xl bg-brand-dark text-white px-4 py-3 hover:opacity-80 transition-opacity">Login</a>
      }

    </nav>
  </div>
</header>
